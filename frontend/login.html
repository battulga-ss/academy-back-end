<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      /* Body styling */
      body {
        font-family: Arial, sans-serif;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 0;
        margin: 0;
        min-height: 100vh;
        color: #333;
      }

      /* Title */
      h1 {
        font-size: 32px;
        margin-bottom: 20px;
      }

      /* Inputs */
      input {
        width: 250px;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
        display: block;
      }

      input:focus {
        border-color: #999;
        outline: none;
      }

      /* Buttons */
      button {
        width: 270px;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        background-color: #fff;
        color: #333;
        transition: all 0.2s ease;
        display: block;
      }

      button:hover {
        background-color: #f0f0f0;
      }
    </style>
  </head>
  <body>

    <h1>login</h1>
     <input
      type="email"
      id="email"
      placeholder="Email"
      required
    /><br /><br />

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    /><br /><br />

    <button id="login" onclick="login()">login</button>
    <button id="signup" onclick="signup()">Sign-up</button>

    <script>
      const login = async () => {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (!email || !password) {
          alert("mail or pass buruu");
          return;
        }

        const response = await fetch("http://localhost:3000/user/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        if (response.ok) {
          window.location.href = "/bank.html";
        } else {
          window.alert("amjiltgui");
        }
      };

      const signup = async () => {
        const response = await fetch("http://localhost:3000/user/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        if (response.ok) {
          window.location.href = "/signup.html";
        } else {
          window.alert("amjiltgui");
        }
      };
    </script>

  </body>
</html>
